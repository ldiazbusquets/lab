name: Export segmentation model
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu && pip install onnx==1.17.0 onnxruntime==1.20.1 numpy
      - run: python tools/export_seg.py
      - run: |
          ls -la models/seg.onnx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/seg.onnx
          git commit -m "Add models/seg.onnx (LR-ASPP MobileNetV3, exported by tools/export_seg.py)" || echo nothing to commit
          git push
